<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Skaner Pokemonów — Czytnik Kart Pokemon</title>

    <meta name="theme-color" content="#DC0A2D">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Skaner Pokemonów">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        /* =========================================================
           1. DESIGN TOKENS & TACTILE POKEDEX / TCG STYLING
           ========================================================= */
        :root {
            --dex-red: #DC0A2D;
            --dex-red-dark: #A60520;
            --paper-cream: #F7F4EB;
            --paper-warm: #EFE9D8;
            --ink-black: #18181B;
            --ink-muted: #52525B;
            --crt-bg: #15181C;
            --crt-text: #F7F4EB;
            --led-blue: #29B6F6;
            --led-amber: #FBC02D;
            --led-green: #2E7D32;
            --border-w: 3px;
            --shadow-hard: 4px 4px 0px #18181B;
            --shadow-shell: 7px 7px 0px #18181B;
            --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background-color: #1D1B20;
            background-image: radial-gradient(#35313A 1.25px, transparent 1.25px);
            background-size: 18px 18px;
            color: var(--ink-black);
            font-family: var(--font-ui);
            overscroll-behavior-y: none;
        }

        .app-stage {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
        }

        @media (min-width: 520px) {
            .app-stage {
                padding: 16px 12px 28px;
            }
        }

        .pokedex-shell {
            width: 100%;
            max-width: 460px;
            min-height: 100vh;
            background-color: var(--dex-red);
            border: var(--border-w) solid var(--ink-black);
            box-shadow: var(--shadow-shell);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        @media (min-width: 520px) {
            .pokedex-shell {
                min-height: calc(100vh - 44px);
                border-radius: 16px;
            }
        }

        .pt-safe { padding-top: max(10px, env(safe-area-inset-top)); }
        .pb-safe { padding-bottom: max(10px, env(safe-area-inset-bottom)); }

        /* =========================================================
           2. ANIMACJA OGNI Z LEWEJ I PRAWEJ (1.5 SEKUNDY NA START)
           ========================================================= */
        .opening-fire-layer {
            position: fixed;
            inset: 0;
            z-index: 120;
            pointer-events: none;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.22s ease, visibility 0.22s ease;
        }

        .opening-fire-layer.active {
            opacity: 1;
            visibility: visible;
        }

        .fire-bank {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 46%;
            max-width: 240px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 0;
        }

        .fire-bank.left { left: 0; transform-origin: left center; }
        .fire-bank.right { right: 0; transform-origin: right center; }

        .flame-tongue {
            position: relative;
            height: 68px;
            width: 100%;
            margin: -10px 0;
        }

        .flame-shape {
            position: absolute;
            top: 50%;
            width: 120px;
            height: 54px;
            margin-top: -27px;
            clip-path: polygon(0% 50%, 28% 8%, 62% 22%, 100% 50%, 62% 78%, 28% 92%);
            border: 2px solid #18181B;
        }

        .fire-bank.left .flame-shape {
            left: -24px;
            background: linear-gradient(90deg, #B91C1C 0%, #EA580C 48%, #FACC15 100%);
            animation: fireSurgeLeft 1.5s cubic-bezier(0.16, 0.9, 0.25, 1) forwards;
            animation-delay: var(--f-delay, 0ms);
        }

        .fire-bank.right .flame-shape {
            right: -24px;
            background: linear-gradient(270deg, #B91C1C 0%, #EA580C 48%, #FACC15 100%);
            animation: fireSurgeRight 1.5s cubic-bezier(0.16, 0.9, 0.25, 1) forwards;
            animation-delay: var(--f-delay, 0ms);
        }

        .flame-core {
            position: absolute;
            top: 50%;
            width: 72px;
            height: 26px;
            margin-top: -13px;
            clip-path: polygon(0% 50%, 35% 15%, 100% 50%, 35% 85%);
            background-color: #FEF08A;
        }

        .fire-bank.left .flame-core {
            left: -6px;
            animation: fireCoreLeft 1.5s ease-out forwards;
            animation-delay: var(--f-delay, 0ms);
        }

        .fire-bank.right .flame-core {
            right: -6px;
            animation: fireCoreRight 1.5s ease-out forwards;
            animation-delay: var(--f-delay, 0ms);
        }

        @keyframes fireSurgeLeft {
            0% { transform: translateX(-40%) scaleX(0.55) scaleY(0.7); opacity: 0; }
            22% { transform: translateX(28%) scaleX(1.38) scaleY(1.12); opacity: 1; }
            55% { transform: translateX(46%) scaleX(1.55) scaleY(0.96); opacity: 0.95; }
            100% { transform: translateX(-65%) scaleX(0.4) scaleY(0.5); opacity: 0; }
        }

        @keyframes fireSurgeRight {
            0% { transform: translateX(40%) scaleX(0.55) scaleY(0.7); opacity: 0; }
            22% { transform: translateX(-28%) scaleX(1.38) scaleY(1.12); opacity: 1; }
            55% { transform: translateX(-46%) scaleX(1.55) scaleY(0.96); opacity: 0.95; }
            100% { transform: translateX(65%) scaleX(0.4) scaleY(0.5); opacity: 0; }
        }

        @keyframes fireCoreLeft {
            0% { transform: translateX(-20%) scaleX(0.5); opacity: 0; }
            25% { transform: translateX(35%) scaleX(1.35); opacity: 1; }
            100% { transform: translateX(-40%) scaleX(0.3); opacity: 0; }
        }

        @keyframes fireCoreRight {
            0% { transform: translateX(20%) scaleX(0.5); opacity: 0; }
            25% { transform: translateX(-35%) scaleX(1.35); opacity: 1; }
            100% { transform: translateX(40%) scaleX(0.3); opacity: 0; }
        }

        /* =========================================================
           3. SKRADAJACE SIE POKEMONY CO 5 MINUT (300,000 MS)
           ========================================================= */
        .sneak-pokemon-stage {
            position: fixed;
            inset: 0;
            z-index: 95;
            pointer-events: none;
            overflow: hidden;
        }

        .sneak-sprite-box {
            position: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            opacity: 0;
            pointer-events: none;
        }

        .sneak-bubble {
            background-color: var(--paper-cream);
            color: var(--ink-black);
            border: 2.5px solid var(--ink-black);
            border-radius: 8px;
            padding: 3px 7px;
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 800;
            box-shadow: 2px 2px 0px var(--ink-black);
            white-space: nowrap;
        }

        .sneak-sprite-box.from-left {
            left: -74px;
            bottom: 84px;
            animation: sneakAcrossLeft 4.2s cubic-bezier(0.22, 0.9, 0.3, 1) forwards;
        }

        .sneak-sprite-box.from-right {
            right: -74px;
            bottom: 132px;
            animation: sneakAcrossRight 4.2s cubic-bezier(0.22, 0.9, 0.3, 1) forwards;
        }

        .sneak-sprite-box.from-top {
            top: -74px;
            left: 24px;
            animation: sneakPeekTop 4.2s cubic-bezier(0.22, 0.9, 0.3, 1) forwards;
        }

        @keyframes sneakAcrossLeft {
            0% { transform: translateX(0) translateY(0) rotate(-4deg); opacity: 0; }
            14% { transform: translateX(82px) translateY(-6px) rotate(3deg); opacity: 1; }
            32% { transform: translateX(130px) translateY(2px) rotate(-3deg); opacity: 1; }
            55% { transform: translateX(195px) translateY(-8px) rotate(4deg); opacity: 1; }
            82% { transform: translateX(255px) translateY(0px) rotate(-2deg); opacity: 0.9; }
            100% { transform: translateX(350px) translateY(-4px) rotate(0deg); opacity: 0; }
        }

        @keyframes sneakAcrossRight {
            0% { transform: translateX(0) translateY(0) rotate(4deg); opacity: 0; }
            14% { transform: translateX(-82px) translateY(-6px) rotate(-3deg); opacity: 1; }
            32% { transform: translateX(-130px) translateY(2px) rotate(3deg); opacity: 1; }
            55% { transform: translateX(-195px) translateY(-8px) rotate(-4deg); opacity: 1; }
            82% { transform: translateX(-255px) translateY(0px) rotate(2deg); opacity: 0.9; }
            100% { transform: translateX(-350px) translateY(-4px) rotate(0deg); opacity: 0; }
        }

        @keyframes sneakPeekTop {
            0% { transform: translateY(0) rotate(-6deg); opacity: 0; }
            18% { transform: translateY(84px) rotate(4deg); opacity: 1; }
            45% { transform: translateY(72px) translateX(22px) rotate(-4deg); opacity: 1; }
            72% { transform: translateY(88px) translateX(-12px) rotate(3deg); opacity: 1; }
            100% { transform: translateY(-30px) rotate(0deg); opacity: 0; }
        }

        /* =========================================================
           4. NAGLOWEK, PRZYCISKI, PANELE I WIZJER 63x88 MM
           ========================================================= */
        .dex-header {
            background-color: var(--dex-red);
            border-bottom: var(--border-w) solid var(--ink-black);
            padding: 10px 12px 12px;
            position: sticky;
            top: 0;
            z-index: 40;
        }

        .dex-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .dex-leds-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .lens-blue {
            width: 38px;
            height: 38px;
            border-radius: 999px;
            background-color: var(--led-blue);
            border: var(--border-w) solid var(--ink-black);
            box-shadow:
                inset -4px -4px 0px rgba(0, 0, 0, 0.28),
                inset 4px 4px 0px rgba(255, 255, 255, 0.55),
                2px 2px 0px var(--ink-black);
            position: relative;
            flex-shrink: 0;
        }

        .lens-blue::after {
            content: "";
            position: absolute;
            top: 6px;
            left: 7px;
            width: 9px;
            height: 6px;
            border-radius: 999px;
            background-color: rgba(255, 255, 255, 0.85);
            transform: rotate(-25deg);
        }

        .pokedex-shell.is-scanning .lens-blue {
            animation: lensPulse 0.7s infinite alternate;
            background-color: #67E8F9;
        }

        .mini-leds {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 2px;
        }

        .mini-led {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            border: 2px solid var(--ink-black);
        }

        .mini-led.red { background-color: #FF5252; }
        .mini-led.amber { background-color: var(--led-amber); }
        .mini-led.green { background-color: #4CAF50; }

        .dex-title {
            margin: 0;
            font-size: 16.5px;
            font-weight: 900;
            letter-spacing: -0.02em;
            color: var(--paper-cream);
            text-shadow: 2px 2px 0px var(--ink-black);
            line-height: 1.1;
            white-space: nowrap;
        }

        .trainer-pill-btn {
            margin-top: 4px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 8px;
            border-radius: 6px;
            background-color: var(--paper-cream);
            color: var(--ink-black);
            border: 2px solid var(--ink-black);
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--ink-black);
            max-width: 215px;
        }

        .trainer-pill-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--ink-black);
        }

        .trainer-dot {
            width: 9px;
            height: 9px;
            border-radius: 999px;
            border: 1.5px solid var(--ink-black);
            flex-shrink: 0;
            background-color: #2E7D32;
        }

        .trainer-pill-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tcg-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 11px;
            border-radius: 8px;
            border: var(--border-w) solid var(--ink-black);
            background-color: var(--paper-cream);
            color: var(--ink-black);
            font-family: var(--font-ui);
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--ink-black);
            transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.14s ease;
            user-select: none;
        }

        .tcg-btn:hover { background-color: #FFFDF7; }
        .tcg-btn:active {
            transform: translate(2.5px, 2.5px);
            box-shadow: 0.5px 0.5px 0px var(--ink-black);
        }

        .tcg-btn.sm {
            padding: 6px 9px;
            font-size: 11px;
            box-shadow: 2px 2px 0px var(--ink-black);
        }

        .tcg-btn.sm:active {
            transform: translate(1.5px, 1.5px);
            box-shadow: 0.5px 0.5px 0px var(--ink-black);
        }

        .tcg-btn.primary {
            background-color: var(--led-amber);
            color: var(--ink-black);
            font-size: 13.5px;
            padding: 12px 14px;
        }

        .tcg-btn.primary:hover { background-color: #FFD54F; }
        .tcg-btn.danger { background-color: #FFCDD2; color: #7F1D1D; }
        .tcg-btn.success { background-color: #C8E6C9; color: #1B5E20; }
        .tcg-btn.is-hidden-installed { display: none !important; }

        .paper-panel {
            background-color: var(--paper-cream);
            color: var(--ink-black);
            border: var(--border-w) solid var(--ink-black);
            border-radius: 10px;
            box-shadow: var(--shadow-hard);
            padding: 12px;
        }

        .paper-panel.warm { background-color: var(--paper-warm); }

        .crt-screen {
            background-color: var(--crt-bg);
            color: var(--crt-text);
            border: var(--border-w) solid var(--ink-black);
            border-radius: 10px;
            box-shadow: inset 0 0 0 2px #2D333B, 3px 3px 0px var(--ink-black);
        }

        .mono {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
        }

        .dex-main {
            flex: 1;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 40px;
        }

        .viewfinder-outer {
            background-color: #141417;
            border: var(--border-w) solid var(--ink-black);
            border-radius: 12px;
            padding: 10px;
            box-shadow: var(--shadow-hard);
        }

        .viewfinder-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 8px;
            font-size: 11px;
            font-weight: 800;
            color: #E4E4E7;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 7px;
            border-radius: 4px;
            border: 1.5px solid #000;
            background-color: #27272A;
            color: #FACC15;
            font-family: var(--font-mono);
            font-size: 10px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background-color: #4ADE80;
        }

        .card-frame-stage {
            position: relative;
            width: 100%;
            max-width: 282px;
            aspect-ratio: 63 / 88;
            margin: 0 auto;
            background-color: #09090B;
            border: var(--border-w) solid #F7F4EB;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-frame-stage video,
        .card-frame-stage img.preview-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .centering-grid {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 4;
            border: 2px dashed rgba(250, 204, 21, 0.78);
            border-radius: 7px;
            margin: 8px;
        }

        .centering-grid::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(250, 204, 21, 0.35);
        }

        .centering-grid::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 1px;
            background: rgba(250, 204, 21, 0.35);
        }

        .corner-mark {
            position: absolute;
            width: 18px;
            height: 18px;
            border-color: #FACC15;
            border-style: solid;
            pointer-events: none;
            z-index: 5;
            animation: cornerPulse 1.8s ease-in-out infinite;
        }

        .corner-mark.tl { top: 4px; left: 4px; border-width: 3px 0 0 3px; border-top-left-radius: 5px; }
        .corner-mark.tr { top: 4px; right: 4px; border-width: 3px 3px 0 0; border-top-right-radius: 5px; }
        .corner-mark.bl { bottom: 4px; left: 4px; border-width: 0 0 3px 3px; border-bottom-left-radius: 5px; }
        .corner-mark.br { bottom: 4px; right: 4px; border-width: 0 3px 3px 0; border-bottom-right-radius: 5px; }

        .scan-beam {
            position: absolute;
            left: 4%;
            right: 4%;
            height: 3px;
            background-color: #FF2A4B;
            box-shadow: 0 0 8px #FF2A4B;
            z-index: 6;
            pointer-events: none;
            top: 8%;
            opacity: 0.6;
            animation: scanSweepIdle 3.2s ease-in-out infinite;
        }

        .pokedex-shell.is-scanning .scan-beam {
            background-color: #29B6F6;
            box-shadow: 0 0 12px #29B6F6;
            height: 4px;
            opacity: 1;
            animation: scanSweepActive 1.1s ease-in-out infinite;
        }

        .analyzing-overlay {
            position: absolute;
            inset: 0;
            background-color: rgba(16, 18, 22, 0.92);
            z-index: 10;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            text-align: center;
            color: var(--paper-cream);
            gap: 10px;
        }

        .analyzing-overlay.show { display: flex; }

        .pokeball-spinner {
            width: 42px;
            height: 42px;
            border-radius: 999px;
            border: 3px solid #F7F4EB;
            background: linear-gradient(to bottom, #DC0A2D 0 46%, #18181B 46% 54%, #F7F4EB 54% 100%);
            position: relative;
            animation: spinBall 0.85s linear infinite;
        }

        .pokeball-spinner::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            border-radius: 999px;
            background-color: #F7F4EB;
            border: 2.5px solid #18181B;
            transform: translate(-50%, -50%);
        }

        .file-upload-bar {
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background-color: #222227;
            border: 2px solid #3F3F46;
            border-radius: 8px;
            padding: 8px 10px;
            color: #F4F4F5;
            font-size: 12px;
        }

        .file-name-label {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #D4D4D8;
            font-size: 11.5px;
            flex: 1;
            text-align: right;
        }

        .not-card-banner {
            background-color: #DC0A2D;
            color: #FFFDF7;
            border: var(--border-w) solid var(--ink-black);
            border-radius: 10px;
            box-shadow: var(--shadow-hard);
            padding: 12px;
            text-align: center;
            font-weight: 900;
            font-size: 15px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            animation: cardReveal 0.22s ease both;
        }

        .report-card { animation: cardReveal 0.3s cubic-bezier(0.2, 0.95, 0.3, 1.08) both; }

        .price-highlight-box {
            padding: 11px;
            border-radius: 8px;
            border: var(--border-w) solid var(--ink-black);
            background-color: var(--crt-bg);
            color: var(--crt-text);
            box-shadow: inset 0 0 0 2px #2D333B;
        }

        .price-main-val {
            font
